<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUK Admission Application Form</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Main Form Container */
        .admission-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Header Styling */
        .form-header {
            background-color: #004080; /* A classic university blue */
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .form-header h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .form-header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        /* Form Body & Grid Layout */
        form {
            padding: 30px;
        }

        .section-title {
            color: #004080;
            border-bottom: 2px solid #004080;
            padding-bottom: 5px;
            margin-bottom: 20px;
            margin-top: 30px;
            font-size: 18px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 5px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #004080;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 64, 128, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Checkbox & Button */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .submit-btn {
            background-color: #004080;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #002d5a;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="admission-container">
        <div class="form-header">
            <h2>Central University of Kerala</h2>
            <p>Undergraduate / Postgraduate Admission Form</p>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Program Details -->
            <h3 class="section-title">1. Program Selection</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="program">Applying For</label>
                    <select id="program" name="program" required>
                        <option value="">-- Select Program --</option>
                        <option value="BA">Bachelor of Arts (B.A.)</option>
                        <option value="BSc">Bachelor of Science (B.Sc.)</option>
                        <option value="MA">Master of Arts (M.A.)</option>
                        <option value="MSc">Master of Science (M.Sc.)</option>
                        <option value="MSW">Master of Social Work (MSW)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cuet-roll">CUET Roll Number</label>
                    <input type="text" id="cuet-roll" name="cuet-roll" placeholder="Enter CUET Roll No." required>
                </div>
            </div>

            <!-- Personal Details -->
            <h3 class="section-title">2. Personal Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="fullname">Full Name (As per 10th Certificate)</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">-- Select --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Transgender">Transgender</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Social Category</label>
                    <select id="category" name="category" required>
                        <option value="UR">Unreserved (UR)</option>
                        <option value="OBC">OBC (Non-Creamy Layer)</option>
                        <option value="SC">Scheduled Caste (SC)</option>
                        <option value="ST">Scheduled Tribe (ST)</option>
                        <option value="EWS">EWS</option>
                    </select>
                </div>
            </div>

            <!-- Contact Details -->
            <h3 class="section-title">3. Contact Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number" required>
                </div>
                <div class="form-group full-width">
                    <label for="address">Permanent Address</label>
                    <textarea id="address" name="address" required></textarea>
                </div>
            </div>

            <!-- Document Uploads -->
            <h3 class="section-title">4. Document Uploads</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="photo">Recent Passport Photo (JPG/PNG)</label>
                    <input type="file" id="photo" name="photo" accept="image/png, image/jpeg" required>
                </div>
                <div class="form-group">
                    <label for="signature">Scanned Signature (JPG/PNG)</label>
                    <input type="file" id="signature" name="signature" accept="image/png, image/jpeg" required>
                </div>
            </div>

            <!-- Declaration -->
            <div class="checkbox-group">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration" style="font-weight: normal; margin-bottom: 0;">
                    I hereby declare that the information provided above is true and correct to the best of my knowledge. I understand that my admission may be cancelled if any information is found incorrect.
                </label>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

</body>
</html>
