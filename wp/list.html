<html lang="en">

<head>
    <title>HTML Lists</title>
</head>

<body>

    <h1>HTML Lists</h1>

    <!-- Ordered List -->
    <h2>My Subjects</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ol>

    <!-- Unordered List -->
    <h2>My Favorite Fruits</h2>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

</body>

</html>
