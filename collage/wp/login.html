<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Admin Forms</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Form Container Styling */
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Input Field Styling */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Button Styling */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login {
            background-color: #007bff;
            color: white;
        }

        .btn-login:hover {
            background-color: #0056b3;
        }

        .btn-admin {
            background-color: #28a745;
            color: white;
        }

        .btn-admin:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <!-- ======================= -->
    <!--     USER LOGIN FORM     -->
    <!-- ======================= -->
    <div class="form-container">
        <h2>User Login</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>
    </div>

    <!-- ======================= -->
    <!--    ADMIN ACTION FORM    -->
    <!-- ======================= -->
    <div class="form-container">
        <h2>Admin Panel</h2>
        <p style="text-align:center; color:#777; font-size:12px; margin-top:-10px;">Register a new employee</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="new-email">Employee Email</label>
                <input type="email" id="new-email" name="new-email" required placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label for="role">Assign Role</label>
                <select id="role" name="role">
                    <option value="user">Standard User</option>
                    <option value="editor">Content Editor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="temp-password">Temporary Password</label>
                <input type="password" id="temp-password" name="temp-password" required placeholder="Create a temp password">
            </div>

            <button type="submit" class="btn-admin">Create Account</button>
        </form>
    </div>

</body>
</html>
